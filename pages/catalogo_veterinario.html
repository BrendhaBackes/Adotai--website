<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinários | Adotaí</title>
    <link rel="stylesheet" href="../styles/index_style.css">
    <link rel="stylesheet" href="../styles/catalogo_veterinario_style.css">
    <script src="../scripts/layout.js" defer></script>
    <script src="../scripts/header_auth.js" defer></script>
    <script src="../scripts/catalogo_veterinario_handler.js" defer></script>
</head>
<body>
    <header id="site-header"></header>

    <main>
        <section id="veterinarios">
            <h1>VETERINÁRIOS</h1>
            <p class="vet-subtitulo">Profissionais cadastrados no Adotaí. Entre em contato para agendar uma consulta.</p>

            <input type="search" id="vet-busca" class="vet-busca"
                   placeholder="Buscar por nome, especialidade, serviço ou cidade"
                   aria-label="Buscar veterinários" autocomplete="off">

            <div id="vet-card-list"></div>
            <p id="vet-aviso" class="vet-aviso" role="status" hidden></p>
        </section>
    </main>

    <footer id="site-footer"></footer>
</body>
</html>
