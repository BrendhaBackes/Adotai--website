<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planos | Adotaí</title>
    <link rel="stylesheet" href="../styles/index_style.css">
    <link rel="stylesheet" href="../styles/catalogo_planos_style.css">
    <script src="../scripts/layout.js" defer></script>
    <script src="../scripts/header_auth.js" defer></script>
    <script src="../scripts/catalogo_planos_handler.js" defer></script>
</head>
<body>
    <header id="site-header"></header>

    <main>
        <section id="planos-disponiveis">
            <h1>PLANOS DISPONÍVEIS</h1>
            <p class="planos-intro">Cuidar bem de um animal também é planejar. Compare os planos e escolha o que cabe na sua rotina.</p>

            <div class="radio-button-group">
                <label class="custom-radio">
                    <input type="radio" name="publico" value="todos" checked />
                    <span>Todos</span>
                </label>
                <label class="custom-radio">
                    <input type="radio" name="publico" value="adotante" />
                    <span>Adotantes</span>
                </label>
                <label class="custom-radio">
                    <input type="radio" name="publico" value="protetor" />
                    <span>Protetores</span>
                </label>
            </div>

            <div id="plano-card-list"></div>
            <p id="planos-aviso" class="planos-aviso" role="status" hidden></p>
        </section>
    </main>

    <footer id="site-footer"></footer>
</body>
</html>
