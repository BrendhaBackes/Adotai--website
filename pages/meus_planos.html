<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus planos | Adotaí</title>
    <link rel="stylesheet" href="../styles/index_style.css">
    <link rel="stylesheet" href="../styles/protetor_painel_style.css">
    <link rel="stylesheet" href="../styles/meus_planos_style.css">
    <script src="../scripts/layout.js" defer></script>
    <script src="../scripts/header_auth.js" defer></script>
    <script src="../scripts/meus_planos_handler.js" defer></script>
</head>
<body>
    <header id="site-header"></header>

    <!-- O id "protetor-painel" é mantido de propósito: é ele que dá o layout (menu lateral + conteúdo)
         no protetor_painel_style.css, reaproveitado aqui para as telas ficarem idênticas. -->
    <main id="protetor-painel">

        <!-- ===== Menu lateral ===== -->
        <aside class="painel-lateral">
            <div class="painel-perfil">
                <span class="painel-avatar" aria-hidden="true">
                    <img src="../images/user_icon.png" alt="">
                </span>
                <div>
                    <p class="painel-perfil-rotulo">Área do usuário</p>
                    <p class="painel-perfil-nome" id="painel-nome">Bem-vindo(a)!</p>
                </div>
            </div>

            <nav class="painel-abas" aria-label="Minha área">
                <a class="painel-aba" id="menu-desejos" href="./lista_desejos.html">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                    <span>Lista de desejos</span>
                </a>

                <a class="painel-aba" id="menu-planos" href="./meus_planos.html" aria-current="page">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 3l8 3v6c0 4.5-3.2 8.2-8 9-4.8-.8-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>
                    </svg>
                    <span>Meus planos</span>
                </a>
            </nav>
        </aside>

        <div class="painel-conteudo">

            <!-- O JS preenche a lista com os dados de api/assinatura_listar.php:
                 só as assinaturas do adotante logado. -->
            <section class="painel-card" id="painel-planos">

                <div class="painel-titulo">
                    <h1>Meus planos</h1>
                    <p>Acompanhe os planos que você assinou e cancele quando quiser.</p>
                </div>

                <p class="aviso aviso-sucesso" id="planos-sucesso" role="status" hidden></p>

                <p class="meus-animais-resumo" id="planos-resumo" hidden></p>

                <div class="aviso aviso-erro aviso-acao" id="planos-erro" role="alert" hidden>
                    <span id="planos-erro-texto"></span>
                    <button type="button" class="btn-mini" id="planos-tentar">Tentar de novo</button>
                </div>

                <p class="meus-animais-carregando" id="planos-carregando" role="status" hidden>Carregando seus planos...</p>

                <div class="animal-lista" id="planos-lista"></div>

                <div class="vazio" id="planos-vazio" hidden>
                    <img src="../images/pata_login.png" alt="">
                    <h2>Nenhum plano assinado</h2>
                    <p>Quando você assinar um plano, ele aparecerá aqui.</p>
                    <a class="btn-salvar btn-link" href="./catalogo_planos.html">Ver planos disponíveis</a>
                </div>
            </section>

        </div>
    </main>

    <footer id="site-footer"></footer>
</body>
</html>
