<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animais disponíveis | Adotaí</title>
    <link rel="stylesheet" href="../styles/index_style.css">
    <link rel="stylesheet" href="../styles/catalogo_style.css">
    <script src="../scripts/layout.js" defer></script>
    <script src="../scripts/header_auth.js" defer></script>
    <script src="../scripts/catalogo_handler.js" defer></script>
</head>
<body>
    <header id="site-header"></header>

    <main>
        <section id="animais-disponiveis">
            <h1>ANIMAIS DISPONÍVEIS</h1>

            <div class="radio-button-group">
                <label class="custom-radio">
                    <input type="radio" name="animals" value="todos" checked />
                    <span>Todos</span>
                </label>
                <label class="custom-radio">
                    <input type="radio" name="animals" value="Cães" />
                    <span>Cães</span>
                </label>
                <label class="custom-radio">
                    <input type="radio" name="animals" value="Gatos" />
                    <span>Gatos</span>
                </label>
                <label class="custom-radio">
                    <input type="radio" name="animals" value="Filhotes" />
                    <span>Filhotes</span>
                </label>
                <label class="custom-radio">
                    <input type="radio" name="animals" value="Outros" />
                    <span>Outros</span>
                </label>
            </div>

            <div id="animal-card-list"></div>
            <p id="catalogo-aviso" class="catalogo-aviso" role="status" hidden></p>
        </section>
    </main>
    <footer id="site-footer"></footer>
</body>
</html>
